---
- hosts: aws_ec2
  connection: ssh
  user: ec2-user

  tasks:
    - name: install webserver
      yum:
        name: httpd
        state: present
    - name: start web server
      service:
        name: httpd
        state: started
    - name: install git
      yum:
        name: git
        state: present
    - name: delete existing path
      file:
        path: /var/www
        state: absent
    - name: src from github
      git:
        repo: "https://github.com/devops0014/staticsite-docker.git"
        dest: /var/www/
        update: yes
        version: master
